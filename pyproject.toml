[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omr-grader"
version = "4.2.0"
description = "OMR Grader 데스크톱 애플리케이션"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.11.2",
    "PySide6_Essentials==6.11.2",
    "PySide6_Addons==6.11.2",
    "shiboken6==6.11.2",
    "opencv-python==4.11.0.86",
    "numpy==2.2.6",
    "PyMuPDF==1.26.1",
    "openpyxl==3.1.5",
    "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-qt==4.4.0",
    "pytest-cov==6.2.1",
    "hypothesis==6.131.15",
    "ruff==0.11.13",
    "mypy==1.16.1",
    "types-openpyxl==3.1.5.20260724",
]
build = [
    "pyinstaller==6.14.1",
    "pyinstaller-hooks-contrib==2026.6",
]

[project.scripts]
omr-grader = "omr_grader.bootstrap:run"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["omr_grader*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["packaged: requires a built Windows portable release"]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "DTZ", "RUF", "SIM", "PERF"]
# RUF001-003 flag the Korean text (ambiguous-unicode checks) and are not useful here.
lint.ignore = ["RUF001", "RUF002", "RUF003"]

# Files edited in parallel 4.2.1 work. These rules fire there but are left for the
# integrator to fix after the merge; remove each entry then.
[tool.ruff.lint.per-file-ignores]
"src/omr_grader/bootstrap.py" = ["I001"]
"src/omr_grader/infrastructure/backup_archive.py" = ["SIM105"]
"src/omr_grader/infrastructure/session_store.py" = ["SIM105", "PERF401"]
"src/omr_grader/infrastructure/update_check.py" = ["RUF100"]
"src/omr_grader/ui/app_controller.py" = ["I001", "SIM105", "SIM114", "RUF021"]
"src/omr_grader/ui/dashboard_page.py" = ["I001", "RUF100"]
"src/omr_grader/ui/main_window.py" = ["I001", "RUF007"]
"src/omr_grader/workbooks/answer_key.py" = ["SIM105"]
"src/omr_grader/workbooks/combined_book.py" = ["RUF005"]
"src/omr_grader/workbooks/response_book.py" = ["RUF022"]
"src/omr_grader/workbooks/response_import.py" = ["SIM105"]
"src/omr_grader/workbooks/roster_sample.py" = ["SIM105"]
"src/omr_grader/workbooks/subject_config.py" = ["I001", "RUF009", "SIM105"]
