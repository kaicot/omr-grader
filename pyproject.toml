[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omr-grader"
version = "2.0.0"
description = "OMR Grader 데스크톱 애플리케이션"
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.9.1",
    "opencv-python==4.11.0.86",
    "numpy==2.2.6",
    "PyMuPDF==1.26.1",
    "openpyxl==3.1.5",
    "tzdata==2026.3",
]

[project.scripts]
omr-grader = "omr_grader.bootstrap:run"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["omr_grader*"]
namespaces = false
